<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-labelledby="title desc">
  <title id="title">Frida sign hook flow</title>
  <desc id="desc">A flow diagram showing request button, Java signer, native signer, network request and Frida hooks.</desc>
  <rect width="920" height="280" fill="#f7f9fb"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#385a7c"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#9ab0c6;stroke-width:1.4;rx:8}
      .hook{fill:#fff7ed;stroke:#f97316;stroke-width:1.6;rx:8}
      .text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#172033}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#516070}
      .line{stroke:#385a7c;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#f97316;stroke-width:1.4;fill:none;stroke-dasharray:5 4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="box" x="36" y="86" width="140" height="74"/>
  <text class="text" x="65" y="118">点击登录</text>
  <text class="small" x="56" y="141">输入账号密码</text>
  <rect class="box" x="226" y="76" width="150" height="94"/>
  <text class="text" x="258" y="112">Java Signer</text>
  <text class="small" x="246" y="137">buildSign(map)</text>
  <rect class="box" x="426" y="76" width="150" height="94"/>
  <text class="text" x="456" y="112">Native so</text>
  <text class="small" x="453" y="137">nativeSign(bytes)</text>
  <rect class="box" x="626" y="86" width="140" height="74"/>
  <text class="text" x="656" y="118">OkHttp</text>
  <text class="small" x="646" y="141">POST /api/login</text>
  <rect class="box" x="806" y="86" width="84" height="74"/>
  <text class="text" x="831" y="118">服务端</text>
  <text class="small" x="823" y="141">校验签名</text>
  <path class="line" d="M176 123H226"/>
  <path class="line" d="M376 123H426"/>
  <path class="line" d="M576 123H626"/>
  <path class="line" d="M766 123H806"/>
  <rect class="hook" x="238" y="204" width="126" height="48"/>
  <text class="text" x="265" y="233">Hook 参数</text>
  <rect class="hook" x="438" y="204" width="126" height="48"/>
  <text class="text" x="463" y="233">Hook 返回</text>
  <rect class="hook" x="632" y="204" width="128" height="48"/>
  <text class="text" x="653" y="233">Hook Header</text>
  <path class="dash" d="M301 204V170"/>
  <path class="dash" d="M501 204V170"/>
  <path class="dash" d="M696 204V160"/>
</svg>
