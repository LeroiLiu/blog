# Stellar 2.0.0-rc.1 site overrides.
# Unlisted values inherit directly from the theme's official _config.yml.

leftbar:
  enabled: true
  brand:
    name: Leroi
    tagline: 技术实践 | 工程笔记
    image:
      src: /blog/images/brand.svg
      variant: avatar
  menu:
    - id: post
      title: 文章
      icon: default:documents
      url: /
    - id: categories
      title: 分类
      icon: default:category
      url: /categories/
      accent: '#3DC550'
    - id: tags
      title: 标签
      icon: default:hashtag
      url: /tags/
      accent: '#FA6400'
    - id: archives
      title: 归档
      icon: default:calendar
      url: /archives/
      accent: '#7C4DFF'
    - id: about
      title: 关于
      icon: default:profile
      url: /about/
    - type: search
  footer:
    actions:
      - type: link
        title: GitHub
        icon: default:github
        url: https://github.com/leroiliu
      - type: link
        title: RSS
        icon: default:rss
        url: /atom.xml

footer:
  content: |
    本站由刘立陈使用 [Hexo](https://hexo.io/) 与 [Stellar {theme.version}]({theme.tree}) 构建。
    除特别声明外，文章采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议。
  sections:
    - title: 浏览博客
      items:
        - title: 近期发布
          url: /
        - title: 分类
          url: /categories/
        - title: 标签
          url: /tags/
        - title: 归档
          url: /archives/
    - title: 个人链接
      items:
        - title: GitHub
          url: https://github.com/leroiliu
        - title: 原 CSDN 博客
          url: https://blog.csdn.net/Leroi_Liu

profiles:
  blog_index:
    path: /
    listing_nav:
      enabled: true
  page:
    active_menu: about

article:
  listing:
    show_tags: true
  category_colors:
    PHP 与 ThinkPHP: '#7756C8'
    前端与 JavaScript: '#2F7DD1'
    数据库: '#0E9F9A'
    服务器与运维: '#4F8F3A'
    架构与中间件: '#D64B72'
    算法与基础: '#D99216'
    开发工具与效率: '#E67828'
    综合笔记: '#657180'
  show_reading_time: true
  footer:
    license: 本文采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。

appearance:
  preset: card

features:
  color_scheme_switch:
    enabled: true
