# Stellar 2.0.0-rc.1 site overrides.
# Unlisted values inherit directly from the theme's official _config.yml.

leftbar:
  enabled: true
  brand:
    name: Leroi
    tagline: 技术实践 | 工程笔记
    image:
      src: /blog/images/profile/avatar.webp
      variant: avatar
  menu:
    - id: post
      title: 博客
      icon: default:documents
      url: /
    - id: projects
      title: 项目
      icon: site:project
      url: /wiki/
      accent: '#3DC550'
    - id: explore
      title: 探索
      icon: site:explore
      url: /notes/
      accent: '#FA6400'
    - id: friends
      title: 友链
      icon: site:friends
      url: /friends/
      accent: '#F44336'
    - id: about
      title: 关于
      icon: site:about
      url: /about/
      accent: '#b92ed1'
    - type: search
  footer:
    actions:
      - type: link
        title: GitHub
        icon: default:github
        url: https://github.com/leroiliu
      - type: link
        title: RSS
        icon: default:rss
        url: /atom.xml

footer:
  content: |
    本站由刘立陈使用 [Hexo](https://hexo.io/) 与 [Stellar {theme.version}]({theme.tree}) 构建。
    除特别声明外，文章采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议。
  sections:
    - title: 浏览博客
      items:
        - title: 近期发布
          url: /
        - title: 分类
          url: /categories/
        - title: 标签
          url: /tags/
        - title: 归档
          url: /archives/
    - title: 个人链接
      items:
        - title: GitHub
          url: https://github.com/leroiliu
        - title: 原 CSDN 博客
          url: https://blog.csdn.net/Leroi_Liu

profiles:
  blog_index:
    path: /
    listing_nav:
      enabled: true
  page:
    active_menu: null

article:
  style: story
  listing:
    show_tags: true
  category_colors:
    PHP 与 ThinkPHP: '#7756C8'
    前端与 JavaScript: '#2F7DD1'
    数据库: '#0E9F9A'
    服务器与运维: '#4F8F3A'
    架构与中间件: '#D64B72'
    算法与基础: '#D99216'
    开发工具与效率: '#E67828'
    综合笔记: '#657180'
  show_reading_time: true
  footer:
    license: 本文采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。

appearance:
  preset: glass
  typography:
    font_family:
      body: '"LXGW WenKai Screen", system-ui, "Microsoft Yahei", "Helvetica Neue", Helvetica, Arial, sans-serif'

features:
  color_scheme_switch:
    enabled: true
  card_hover:
    enabled: true

preconnect:
  - https://npm.elemecdn.com
  - https://gcore.jsdelivr.net

inject:
  head_end: |
    <link rel="stylesheet" href="https://npm.elemecdn.com/lxgw-wenkai-screen-webfont/style.css" media="print" onload="this.media='all'">
